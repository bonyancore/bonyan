# scripts/d2/d2.conf  (bash syntax)
# The agent fills the *_CMD values during bootstrap (Runbook section 1.6) with the REAL commands of this repo.
# finish-ticket.sh refuses to run while TEST_CMD is empty.

BASE_BRANCH="main"
WORK_BRANCH="d2/work"

BUILD_CMD="dotnet build backend/Construction.sln -warnaserror"   # PRE-FILLED from the repo tree: VERIFY in bootstrap
TEST_CMD="dotnet test backend/Construction.sln --filter \"Category!=Slow\""   # PRE-FILLED: VERIFY in bootstrap (REQUIRED)
ARCH_CMD=""         # architecture tests (backend/tests/Architecture.Tests is empty today: fill when it has projects)
CONTRACT_CMD=""     # event schema + OpenAPI diff tests (backend/tests/Contract.Tests)
ISOLATION_CMD=""    # tenant isolation tests (backend/tests/Tenant.Isolation.Tests)
MIGRATION_CMD=""    # migrations from empty (and from previous release if scripted)
AUDIT_CMD=""        # OPTIONAL independent audit, e.g. "bash audit/run_audit.sh" (needs a running API + dev DB; the human sets it when the environment supports it)

# Lane rules: extended regex matched against repo-relative paths. Order of evaluation:
#  1) REVIEW_REGEX   -> allowed but flagged "needs architect review"
#  2) ALLOWED_REGEX  -> allowed
#  3) anything else  -> VIOLATION (default deny)
# Adjust to the real folder layout during bootstrap if it differs. Keep rules strict.
ALLOWED_REGEX='^(backend/src/Modules/(Platform|Cost|Cash)/|backend/tests/Modules/(Platform|Cost|Cash)/|docs/team/|docs/rfc/|docs/modules/)'
REVIEW_REGEX='^(backend/src/Shared/|backend/src/Modules/(Platform|Cost|Cash)/.*\.Contracts/|backend/src/Integrations/|backend/src/Host/|backend/Construction\.sln|backend/tests/(Architecture\.Tests|Contract\.Tests|Tenant\.Isolation\.Tests|GoldenProject\.Tests|E2E|Load)/|backend/tools/|contracts/|docs/adr/|\.github/|deploy/|docker-compose\.yml|scripts/d2/|audit/api/scenarios\.yaml|audit/db/expectations\.yaml|audit/config\.env)'
